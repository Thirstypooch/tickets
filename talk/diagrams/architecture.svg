<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, 'SF Pro Display', sans-serif">
  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0A0A0A">Tickets · arquitectura</text>

  <!-- Client (Flutter) -->
  <g>
    <rect x="40" y="100" width="240" height="280" rx="14" fill="#E0F2FE" stroke="#0284C7" stroke-width="2"/>
    <text x="160" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#0284C7">📱 Flutter Client</text>
    <text x="160" y="158" text-anchor="middle" font-size="11" fill="#525252">mobile · web · desktop</text>

    <rect x="65" y="180" width="190" height="44" rx="6" fill="#fff" stroke="#0284C7" stroke-width="1"/>
    <text x="160" y="208" text-anchor="middle" font-size="12" fill="#0F172A">UI Widgets</text>

    <rect x="65" y="234" width="190" height="44" rx="6" fill="#fff" stroke="#0284C7" stroke-width="1"/>
    <text x="160" y="262" text-anchor="middle" font-size="12" fill="#0F172A">Riverpod state</text>

    <rect x="65" y="288" width="190" height="44" rx="6" fill="#fff" stroke="#0284C7" stroke-width="1"/>
    <text x="160" y="316" text-anchor="middle" font-size="12" fill="#0F172A">Repositories (Dio)</text>
  </g>

  <!-- Backend (NestJS) -->
  <g>
    <rect x="330" y="100" width="240" height="280" rx="14" fill="#FFE4E6" stroke="#E11D48" stroke-width="2"/>
    <text x="450" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#E11D48">🚀 NestJS API</text>
    <text x="450" y="158" text-anchor="middle" font-size="11" fill="#525252">REST + GraphQL</text>

    <rect x="355" y="180" width="190" height="44" rx="6" fill="#fff" stroke="#E11D48" stroke-width="1"/>
    <text x="450" y="201" text-anchor="middle" font-size="12" fill="#0F172A">/api/events (REST)</text>
    <text x="450" y="216" text-anchor="middle" font-size="10" fill="#737373">/api/graphql (GQL)</text>

    <rect x="355" y="234" width="190" height="44" rx="6" fill="#fff" stroke="#E11D48" stroke-width="1"/>
    <text x="450" y="255" text-anchor="middle" font-size="12" fill="#0F172A">Services</text>
    <text x="450" y="270" text-anchor="middle" font-size="10" fill="#737373">cache 1hr · dedupe</text>

    <rect x="355" y="288" width="190" height="44" rx="6" fill="#fff" stroke="#E11D48" stroke-width="1"/>
    <text x="450" y="316" text-anchor="middle" font-size="12" fill="#0F172A">Auth Guards</text>
  </g>

  <!-- External services -->
  <g>
    <rect x="620" y="100" width="240" height="280" rx="14" fill="#F3E8FF" stroke="#9333EA" stroke-width="2"/>
    <text x="740" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#9333EA">☁️ External</text>
    <text x="740" y="158" text-anchor="middle" font-size="11" fill="#525252">third-party services</text>

    <rect x="645" y="180" width="190" height="80" rx="6" fill="#fff" stroke="#9333EA" stroke-width="1"/>
    <text x="740" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">🎟️ Ticketmaster</text>
    <text x="740" y="228" text-anchor="middle" font-size="11" fill="#737373">Discovery API v2</text>
    <text x="740" y="244" text-anchor="middle" font-size="11" fill="#737373">~21K events / city</text>

    <rect x="645" y="276" width="190" height="80" rx="6" fill="#fff" stroke="#9333EA" stroke-width="1"/>
    <text x="740" y="306" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">🛡️ Supabase</text>
    <text x="740" y="324" text-anchor="middle" font-size="11" fill="#737373">auth + postgres</text>
    <text x="740" y="340" text-anchor="middle" font-size="11" fill="#737373">JWT sessions</text>
  </g>

  <!-- Arrows: Client → Backend -->
  <line x1="280" y1="240" x2="330" y2="240" stroke="#525252" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="305" y="232" text-anchor="middle" font-size="10" fill="#525252">HTTP</text>

  <!-- Arrows: Backend → External -->
  <line x1="570" y1="220" x2="620" y2="220" stroke="#525252" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="595" y="212" text-anchor="middle" font-size="10" fill="#525252">axios</text>

  <line x1="570" y1="316" x2="620" y2="316" stroke="#525252" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="595" y="308" text-anchor="middle" font-size="10" fill="#525252">SDK</text>

  <!-- Arrow definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#525252"/>
    </marker>
  </defs>

  <!-- Footer -->
  <text x="450" y="430" text-anchor="middle" font-size="12" fill="#737373" font-style="italic">datos en vivo · cache 1hr · dedupe en cascada (artist + image + series)</text>
</svg>
