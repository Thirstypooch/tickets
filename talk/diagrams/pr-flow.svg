<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="-apple-system, 'SF Pro Display', sans-serif">
  <!-- Title -->
  <text x="480" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#0A0A0A">PR + CI · el flujo completo</text>

  <!-- Step 1: worktree commit -->
  <g>
    <rect x="30" y="100" width="160" height="120" rx="12" fill="#FCE7F3" stroke="#DB2777" stroke-width="2"/>
    <text x="110" y="135" text-anchor="middle" font-size="36">🤖</text>
    <text x="110" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">1. commit</text>
    <text x="110" y="190" text-anchor="middle" font-size="10" fill="#737373">Claude en worktree</text>
    <text x="110" y="205" text-anchor="middle" font-size="10" fill="#737373">feat/share branch</text>
  </g>

  <!-- Arrow 1 → 2 -->
  <line x1="190" y1="160" x2="225" y2="160" stroke="#525252" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- Step 2: push -->
  <g>
    <rect x="225" y="100" width="160" height="120" rx="12" fill="#E0E7FF" stroke="#4F46E5" stroke-width="2"/>
    <text x="305" y="135" text-anchor="middle" font-size="36">⬆️</text>
    <text x="305" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">2. push</text>
    <text x="305" y="190" text-anchor="middle" font-size="10" fill="#737373">git push origin</text>
    <text x="305" y="205" text-anchor="middle" font-size="10" fill="#737373">feat/share</text>
  </g>

  <!-- Arrow 2 → 3 -->
  <line x1="385" y1="160" x2="420" y2="160" stroke="#525252" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- Step 3: PR -->
  <g>
    <rect x="420" y="100" width="160" height="120" rx="12" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
    <text x="500" y="135" text-anchor="middle" font-size="36">📬</text>
    <text x="500" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">3. PR abierto</text>
    <text x="500" y="190" text-anchor="middle" font-size="10" fill="#737373">gh pr create</text>
    <text x="500" y="205" text-anchor="middle" font-size="10" fill="#737373">→ GitHub</text>
  </g>

  <!-- Arrow 3 → 4 -->
  <line x1="580" y1="160" x2="615" y2="160" stroke="#525252" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- Step 4: CI -->
  <g>
    <rect x="615" y="100" width="160" height="120" rx="12" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
    <text x="695" y="135" text-anchor="middle" font-size="36">⚙️</text>
    <text x="695" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">4. CI corre</text>
    <text x="695" y="190" text-anchor="middle" font-size="10" fill="#737373">build + analyze</text>
    <text x="695" y="205" text-anchor="middle" font-size="10" fill="#737373">~3 min</text>
  </g>

  <!-- Arrow 4 → 5 -->
  <line x1="775" y1="160" x2="810" y2="160" stroke="#525252" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- Step 5: merge -->
  <g>
    <rect x="810" y="100" width="120" height="120" rx="12" fill="#D1FAE5" stroke="#059669" stroke-width="2"/>
    <text x="870" y="135" text-anchor="middle" font-size="36">✅</text>
    <text x="870" y="170" text-anchor="middle" font-size="13" font-weight="600" fill="#0F172A">5. merge</text>
    <text x="870" y="190" text-anchor="middle" font-size="10" fill="#737373">squash</text>
    <text x="870" y="205" text-anchor="middle" font-size="10" fill="#737373">→ main</text>
  </g>

  <!-- Bottom: parallel lane "vos sigues trabajando" -->
  <g>
    <rect x="30" y="265" width="900" height="55" rx="10" fill="#F5F5F5" stroke="#A3A3A3" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="60" y="295" font-size="22">🧑‍💻</text>
    <text x="100" y="290" font-size="13" font-weight="600" fill="#525252">Mientras todo esto pasa:</text>
    <text x="100" y="307" font-size="12" fill="#737373">vos seguís trabajando en main · Flutter sigue corriendo · zero context switch</text>
  </g>

  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#525252"/>
    </marker>
  </defs>
</svg>
